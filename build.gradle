plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
}

// --- Branch fs-2.6-1.21.1: BBS 2.6 on MC 1.21.1 (Java 21) ---
// The 1.20.x targets live on fs-2.6; this branch differs from it only by the
// MC 1.21 render API (BufferBuilder/PostEffectPass/Identifier) and this config.
def mc = (project.findProperty("mc") ?: "1.21.1-fs").toString()
def MC = [
	"1.21.1-fs": [mc: "1.21.1", yarn: "1.21.1+build.3", fabric: "0.116.12+1.21.1", bbs: "bbs-2.6-1.21.1.jar", pin: "1.21.1", suffix: "fs2.6-1.21.1"],
]
if (!MC.containsKey(mc)) {
	throw new GradleException("Unsupported -Pmc=${mc}. Supported: ${MC.keySet().join(', ')}")
}
def mcCfg = MC[mc]

version = project.mod_version + "-" + mcCfg.suffix
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	flatDir {
		dirs 'libs'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"refreshedui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath.set(getRootProject().file("src/main/resources/refreshedui.accesswidener"))
}

dependencies {
	minecraft "com.mojang:minecraft:${mcCfg.mc}"
	mappings "net.fabricmc:yarn:${mcCfg.yarn}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${mcCfg.fabric}"

	modImplementation files("libs/${mcCfg.bbs}")
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc_pin", mcCfg.pin

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "mc_pin": mcCfg.pin
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Diagnostic: `./gradlew runClient -Pprobe` force-loads every mixin target at client init and
// writes run/refreshedui-probe.txt listing which mixin applications passed/failed (see MixinProbe).
if (project.hasProperty("probe")) {
	tasks.named("runClient").configure {
		jvmArgs "-Drefreshedui.probe=true"
	}
}
