plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
}

// --- Branch 1.21.11: BBS FS 2.7 on MC 1.21.11 (Java 21) ---
// The 1.20.x targets live on master and 1.21.1 on its own branch; this branch differs from
// 1.21.1 by the MC 1.21.11 deferred-GUI render API (GuiRenderState, PostEffectPipeline,
// GpuTexture) and this config.
def mc = (project.findProperty("mc") ?: "1.21.11-fs").toString()
def MC = [
	"1.21.11-fs": [mc: "1.21.11", yarn: "1.21.11+build.6", fabric: "0.141.4+1.21.11", bbs: "bbs-2.7-1.21.11.jar", pin: "1.21.11", suffix: "fs2.7-1.21.11"],
]
if (!MC.containsKey(mc)) {
	throw new GradleException("Unsupported -Pmc=${mc}. Supported: ${MC.keySet().join(', ')}")
}
def mcCfg = MC[mc]

version = project.mod_version + "-" + mcCfg.suffix
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	flatDir {
		dirs 'libs'
	}
	mavenCentral()
	maven {
		url "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"refreshedui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath.set(getRootProject().file("src/main/resources/refreshedui.accesswidener"))
}

dependencies {
	minecraft "com.mojang:minecraft:${mcCfg.mc}"
	mappings "net.fabricmc:yarn:${mcCfg.yarn}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${mcCfg.fabric}"

	modImplementation files("libs/${mcCfg.bbs}")

	// TEMP: Sodium on the dev client only (not shipped), testing the frozen-picture bug against its NVIDIA workaround
	modLocalRuntime "maven.modrinth:sodium:mc1.21.11-0.8.7-fabric"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc_pin", mcCfg.pin

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "mc_pin": mcCfg.pin
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Diagnostic: `./gradlew runClient -Pprobe` force-loads every mixin target at client init and
// writes run/refreshedui-probe.txt listing which mixin applications passed/failed (see MixinProbe).
if (project.hasProperty("probe")) {
	tasks.named("runClient").configure {
		jvmArgs "-Drefreshedui.probe=true"
	}
}
